name: Validate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      revision:
        description: Commit or tag to validate.
        required: false
        default: ""
        type: string
      release-tag:
        description: Release tag to verify.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test translation
        run: npm test
      - name: Test release builder
        run: npm run test:release
      - name: Build and validate package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SELECTED_REF: ${{ inputs.revision || github.sha }}
        run: |
          args=(--dist dist --ref "$SELECTED_REF")
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--release-tag "$RELEASE_TAG"); fi
          python -B dev-tools/buildScripts/build_release.py "${args[@]}"
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: |
            dist/*.zip
            dist/module.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
